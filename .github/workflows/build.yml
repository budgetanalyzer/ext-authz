name: Build

on:
  push:
    branches: [main, dependency-automation-trial]
  pull_request:
    branches: [main, dependency-automation-trial]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    if: >-
      ${{
        ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dependency-automation-trial')) ||
        (github.event_name == 'pull_request' &&
          (github.base_ref == 'main' || github.base_ref == 'dependency-automation-trial'))
      }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: >-
            ${{
              (github.ref != 'refs/heads/dependency-automation-trial' &&
                github.base_ref != 'dependency-automation-trial') ||
              vars.DEPENDENCY_AUTOMATION_TRIAL_CACHES_ENABLED == 'true'
            }}

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail

          unformatted="$(gofmt -l .)"
          if [[ -n "${unformatted}" ]]; then
            echo "Go files need gofmt:" >&2
            echo "${unformatted}" >&2
            exit 1
          fi

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p dependency-automation-evidence
          go test ./... 2>&1 | tee -a dependency-automation-evidence/build.log

      - name: Build Docker image
        run: docker build -t ext-authz:ci . 2>&1 | tee -a dependency-automation-evidence/build.log

      - name: Measure complete trial build evidence
        id: trial-evidence
        if: >-
          ${{
            always() &&
            (github.ref == 'refs/heads/dependency-automation-trial' ||
              (github.event_name == 'pull_request' && github.base_ref == 'dependency-automation-trial'))
          }}
        run: >-
          bash .github/scripts/prepare-trial-evidence.sh
          dependency-automation-evidence/build-evidence.tar.gz
          'Trial Go build'
          dependency-automation-evidence/build.log

      - name: Upload capped trial build evidence
        if: >-
          ${{
            always() && vars.DEPENDENCY_AUTOMATION_TRIAL_UPLOADS_ENABLED == 'true' &&
            steps.trial-evidence.outputs.upload_allowed == 'true'
          }}
        uses: actions/upload-artifact@v7
        with:
          name: trial-build-evidence-${{ github.run_id }}
          path: dependency-automation-evidence/build-evidence.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Enforce complete trial build evidence delivery
        if: >-
          ${{
            always() && vars.DEPENDENCY_AUTOMATION_TRIAL_UPLOADS_ENABLED == 'true' &&
            steps.trial-evidence.outputs.upload_allowed != 'true'
          }}
        run: |
          echo 'The complete trial Go build evidence exceeds the capped upload allowance.' >&2
          exit 1
